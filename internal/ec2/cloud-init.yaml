#cloud-config
# Accepted, tracked duplicate of internal/lima/template.yaml.
#
# The toolchain here is deliberately a second copy of the Lima provisioning
# content rather than a shared source of truth, so that the EC2 backend carries
# no VM regression risk. Any toolchain change must be applied to both files.
# Unifying them is named follow-up 8.2 of the ec2-isolation-type spec.

package_update: true

packages:
  - git
  - curl
  - wget
  - ca-certificates
  - gnupg
  - lsb-release
  - unzip
  - zip
  - uidmap
  - dbus-user-session
  - tmux

write_files:
  - path: /etc/sysctl.d/99-rootless-docker.conf
    content: "kernel.apparmor_restrict_unprivileged_userns=0\n"

runcmd:
  # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor,
  # which prevents rootless Docker from starting
  - sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

  # Install Node.js LTS
  - curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -
  - apt-get install -y nodejs

  # Install GitHub CLI
  - curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
  - chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
  - apt-get update
  - apt-get install -y gh

  # Install Claude Code via npm (global install needs root)
  - npm install -g @anthropic-ai/claude-code

  # Install Docker in rootless mode for the ubuntu user
  - runuser -l ubuntu -c 'curl -fsSL https://get.docker.com/rootless | sh'

  # Keep user services (like rootless Docker) running after logout
  - loginctl enable-linger ubuntu

  # Configure shell for rootless Docker
  - runuser -l ubuntu -c 'echo "export PATH=\$HOME/bin:\$PATH" >> ~/.bashrc'
  - runuser -l ubuntu -c 'echo "export DOCKER_HOST=unix:///run/user/$(id -u ubuntu)/docker.sock" >> ~/.bashrc'

  # Install SDKMAN (Java and Gradle are installed separately via install-using-sdkman.sh)
  - runuser -l ubuntu -c 'curl -s "https://get.sdkman.io" | bash'

  # Install uv (Python package manager) for i2code CLI
  - runuser -l ubuntu -c 'curl -LsSf https://astral.sh/uv/install.sh | sh'
