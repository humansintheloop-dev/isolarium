title = "Custom gitleaks config"
extends = "default"

# -----------------------------
# Custom rule: Local user paths
# -----------------------------

[[rules]]
id = "local-unix-home-path"
description = "Local Unix or macOS home directory path"
regex = '''/(?:Users|home)/[A-Za-z0-9._-]+(?:/|$)'''
tags = ["sensitive", "local-path"]
severity = "high"

[rules.allowlist]
description = "Exclude placeholder usernames and well-known instance accounts"
regexes = [
  '''/(Users|home)/(user|username|name)(/|$)''',
  '''/(Users|home)/(dev|test|isolarium|lima\.linux)(/|$)''',
  # Default account on the Ubuntu AMIs used by the EC2 and VM backends
  '''/home/ubuntu(/|$)'''
]
paths = [
  '''.claude/settings.local.json'''
]
